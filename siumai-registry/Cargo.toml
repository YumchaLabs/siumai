[package]
name = "siumai-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Immutable model routing for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-registry"
readme = "../README.md"
keywords = ["llm", "ai", "routing"]
categories = ["api-bindings"]

[lib]
doctest = false

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
siumai-core = { workspace = true, default-features = false }
thiserror.workspace = true

[features]
default = []

# Transitional no-op feature names keep the workspace resolvable while the
# facade's legacy provider relays are removed later in U7. They intentionally
# add no dependencies; provider integration belongs to `siumai`.
structured-messages = []
builtins = []
openai = []
azure = []
anthropic = []
google = []
google-vertex = []
ollama = []
xai = []
groq = []
deepseek = []
deepinfra = []
minimaxi = []
cohere = []
togetherai = []
bedrock = []
gateway = []
deepgram = []
elevenlabs = []
gcp = []
json-repair = []
gzip = []
brotli = []
all-providers = []

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
