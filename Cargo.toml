[workspace]
resolver = "3"
members = [
    "siumai",
    "siumai-core",
    "siumai-transport",
    "siumai-runtime",
    "siumai-mcp",
    "siumai-server",
    "siumai-registry",
    "siumai-provider-openai",
    "siumai-provider-alibaba",
    "siumai-provider-moonshotai",
    "siumai-provider-volcengine",
    "siumai-openai-compatible",
    "siumai-anthropic-compatible",
    "siumai-protocol-openai",
    "siumai-provider-anthropic",
    "siumai-protocol-anthropic",
    "siumai-protocol-gemini",
    "siumai-provider-gemini",
    "siumai-provider-google-vertex",
    "siumai-provider-groq",
    "siumai-provider-xai",
    "siumai-provider-minimax",
    "siumai-provider-deepseek",
    "siumai-provider-cohere",
    "siumai-provider-deepgram",
    "siumai-provider-elevenlabs",
]

[workspace.package]
version = "0.11.0-beta.9"
edition = "2024"
rust-version = "1.88"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/YumchaLabs/siumai"
homepage = "https://github.com/YumchaLabs/siumai"

[workspace.dependencies]
# Async traits
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "stream", "multipart", "gzip", "brotli"] }
http = "1"
httpdate = "1"
url = "2.5"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net", "process"] }
futures = "0.3"

# Streaming
bytes = { version = "1", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# WebSocket (for OpenAI WebSocket transport)
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Error handling
thiserror = "2.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Random number generation (for retry jitter)
rand = "0.10"

# URL encoding
urlencoding = "2.1"
infer = "0.19"

# Core crate (for workspace consumption)
# Disable default features; downstream crates must opt-in provider features explicitly
siumai-core = { version = "0.11.0-beta.9", path = "siumai-core", default-features = false }
siumai-anthropic-compatible = { version = "0.11.0-beta.9", path = "siumai-anthropic-compatible", default-features = false }
siumai-protocol-anthropic = { version = "0.11.0-beta.9", path = "siumai-protocol-anthropic", default-features = false }
siumai-protocol-gemini = { version = "0.11.0-beta.9", path = "siumai-protocol-gemini", default-features = false }
siumai-protocol-openai = { version = "0.11.0-beta.9", path = "siumai-protocol-openai", default-features = false }
siumai-transport = { version = "0.11.0-beta.9", path = "siumai-transport", default-features = false }
siumai-runtime = { version = "0.11.0-beta.9", path = "siumai-runtime", default-features = false }
siumai-registry = { version = "0.11.0-beta.9", path = "siumai-registry", default-features = false }
siumai-provider-alibaba = { version = "0.11.0-beta.9", path = "siumai-provider-alibaba", default-features = false }
siumai-provider-moonshotai = { version = "0.11.0-beta.9", path = "siumai-provider-moonshotai", default-features = false }
siumai-provider-volcengine = { version = "0.11.0-beta.9", path = "siumai-provider-volcengine", default-features = false }

# Security
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.10"

base64 = "0.22.1"

# Optional JSON Schema validation for siumai-runtime
jsonschema = { version = "0.46", default-features = false }

rmcp = { version = "1.6", default-features = false }

# Server adapters
axum = "0.8"
http-body-util = "0.1"

# Dev dependencies
tokio-test = "0.4"
mockito = "1.0"
wiremock = "0.6"

[profile.dist]
inherits = "release"
lto = "thin"
