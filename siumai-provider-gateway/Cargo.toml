[package]
name = "siumai-provider-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Vercel AI Gateway provider implementation for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-gateway"
readme = "../README.md"
keywords = ["llm", "ai", "gateway", "vercel"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-provider-utils = { workspace = true, default-features = false }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
futures-util.workspace = true
async-stream.workspace = true
eventsource-stream.workspace = true
chrono.workspace = true
secrecy.workspace = true
base64.workspace = true

[features]
default = []
gateway = []
structured-messages = ["siumai-core/structured-messages", "siumai-provider-utils/structured-messages"]

[dev-dependencies]
tokio-test.workspace = true
