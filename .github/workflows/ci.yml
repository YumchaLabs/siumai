name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check repository contracts
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B scripts/check_workspace_boundaries.py --target

      - name: Inspect package file lists
        run: |
          set -o pipefail
          cargo package --workspace --list --locked | python3 -B scripts/check_package_file_list.py

      - name: Run focused PR tests
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 -B scripts/test-workspace.py fast --runner nextest

      - name: Run flagship PR tests
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 -B scripts/test-workspace.py flagship --runner nextest

      - name: Run focused PR clippy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo clippy -j 1 -p siumai-core -p siumai-transport -p siumai-runtime -p siumai-registry --all-targets -- -D warnings
          cargo clippy -j 1 -p siumai --no-default-features --features runtime,registry,openai,anthropic,google,google-vertex-anthropic,minimax --all-targets -- -D warnings
          cargo check -j 1 -p siumai-runtime --no-default-features --features json-schema

      - name: Check facade feature ownership
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo check -j 1 -p siumai --no-default-features --lib
          cargo check -j 1 -p siumai --no-default-features --features openai --lib
          cargo check -j 1 -p siumai --no-default-features --features anthropic --lib
          cargo check -j 1 -p siumai --no-default-features --features all-providers --lib
          cargo check -j 1 -p siumai --no-default-features --features openai-responses-websocket,openai-realtime --lib
          cargo check -j 1 -p siumai --no-default-features --features openai --example openai_flagship
          cargo check -j 1 -p siumai --no-default-features --features anthropic --example anthropic_flagship

      - name: Run release-level tests
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 -B scripts/test-workspace.py full --runner nextest

      - name: Run release-level clippy
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo clippy -j 1 --workspace --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check supported workspace surface
        run: cargo check --locked -j 1 --workspace --all-targets --all-features

  docs:
    name: Documentation
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: |
          cargo doc -j 1 -p siumai-provider-openai --all-features --no-deps
          cargo doc -j 1 --workspace --all-features --no-deps
          cargo test -j 1 --doc --workspace --all-features
