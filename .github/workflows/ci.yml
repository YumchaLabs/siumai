name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run repository script tests
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Inspect package file lists
        run: python3 -B scripts/check_package_file_list.py

      - name: Run focused PR tests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -B scripts/test-workspace.py fast --runner nextest
          cargo nextest run -p siumai --all-features --test siumai_builder_contract --test-threads 1
          cargo nextest run -p siumai-runtime --all-features --test runtime_contract --test-threads 1

      - name: Run flagship PR tests
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 -B scripts/test-workspace.py flagship --runner nextest

      - name: Run focused PR clippy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo clippy -j 1 -p siumai-core -p siumai-transport -p siumai-runtime -p siumai-registry --all-targets -- -D warnings
          cargo clippy -j 1 -p siumai --no-default-features --features runtime,registry,openai,anthropic,google,google-vertex-anthropic,minimax --all-targets -- -D warnings
          cargo check -j 1 -p siumai-runtime --no-default-features --features json-schema

      - name: Check facade feature and example ownership
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          cargo check -j 1 -p siumai --no-default-features --lib
          cargo check -j 1 -p siumai --no-default-features --features registry --lib
          cargo check -j 1 -p siumai --no-default-features --features runtime --lib
          cargo nextest run -p siumai --no-default-features --test facade_contract --test facade_migration_contract --test siumai_builder_contract --test-threads 1
          cargo nextest run -p siumai --no-default-features --features registry --test facade_contract --test siumai_builder_contract --test-threads 1
          cargo nextest run -p siumai --no-default-features --features runtime --test facade_contract --test facade_migration_contract --test siumai_builder_contract --test-threads 1
          cargo nextest run -p siumai --no-default-features --features openai,registry --test siumai_builder_contract --test-threads 1
          provider_features="$(
            python3 - <<'PY'
          import json
          import subprocess

          facade_metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--locked", "--no-deps"],
                  text=True,
              )
          )
          package = next(
              package for package in facade_metadata["packages"] if package["name"] == "siumai"
          )
          features = [
              name
              for name, members in package["features"].items()
              if any(
                  member.startswith("dep:siumai-provider-")
                  or member == "dep:siumai-openai-compatible"
                  for member in members
              )
          ]
          if not features:
              raise SystemExit("no facade provider features found in Cargo metadata")

          for feature in features:
              metadata = json.loads(
                  subprocess.check_output(
                      [
                          "cargo",
                          "metadata",
                          "--format-version",
                          "1",
                          "--locked",
                          "--no-default-features",
                          "--features",
                          feature,
                      ],
                      text=True,
                  )
              )
              names = {package["id"]: package["name"] for package in metadata["packages"]}
              nodes = {node["id"]: node for node in metadata["resolve"]["nodes"]}
              facade_id = next(
                  package["id"] for package in metadata["packages"] if package["name"] == "siumai"
              )
              pending = [facade_id]
              reachable = set()
              while pending:
                  package_id = pending.pop()
                  if package_id in reachable:
                      continue
                  reachable.add(package_id)
                  pending.extend(
                      dependency["pkg"]
                      for dependency in nodes[package_id]["deps"]
                      if any(
                          dependency_kind["kind"] != "dev"
                          for dependency_kind in dependency["dep_kinds"]
                      )
                  )

              actual = sorted(
                  names[package_id]
                  for package_id in reachable
                  if names[package_id].startswith("siumai-provider-")
              )
              expected = sorted(
                  member.removeprefix("dep:")
                  for member in package["features"][feature]
                  if member.startswith("dep:siumai-provider-")
              )
              if actual != expected:
                  raise SystemExit(
                      f"facade feature {feature!r} activates provider crates {actual}, expected {expected}"
                  )

          print("\n".join(sorted(features)))
          PY
          )" || exit $?
          while IFS= read -r feature
          do
            cargo check -j 1 -p siumai --no-default-features --features "${feature}" --test siumai_builder_contract
          done <<< "${provider_features}"
          cargo check -j 1 -p siumai --no-default-features --features all-providers,openai-compatible --lib
          cargo check -j 1 -p siumai --no-default-features --features openai-responses-websocket,openai-realtime --lib
          cargo check -j 1 -p siumai --no-default-features --features openai --example openai_flagship
          cargo check -j 1 -p siumai --no-default-features --features anthropic --example anthropic_flagship
          cargo check -j 1 -p siumai --no-default-features --features openai,anthropic,google --example provider_switching
          cargo check -j 1 -p siumai --no-default-features --features openai,registry --example registry_switching
          cargo metadata --format-version 1 --locked > /dev/null

      - name: Run release-level tests
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 -B scripts/test-workspace.py full --runner nextest

      - name: Run release-level clippy
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo clippy -j 1 --workspace --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read workspace MSRV
        id: workspace-msrv
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["workspace"]["package"]["rust-version"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.workspace-msrv.outputs.version }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check supported workspace surface
        run: cargo check --locked -j 1 --workspace --all-targets --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: |
          cargo doc -j 1 -p siumai-provider-openai --all-features --no-deps
          cargo doc -j 1 --workspace --all-features --no-deps
          cargo test -j 1 --doc --workspace --all-features
