[package]
name = "siumai-provider-anthropic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Anthropic provider implementation for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-anthropic"
readme = "../README.md"
keywords = ["llm", "ai", "anthropic"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-anthropic-compatible = { version = "0.11.0-beta.9", path = "../siumai-anthropic-compatible", default-features = false }
siumai-protocol-anthropic = { version = "0.11.0-beta.9", path = "../siumai-protocol-anthropic", default-features = false }
siumai-transport = { workspace = true, default-features = false }

async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
http.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[features]
default = []

[dev-dependencies]
futures-util.workspace = true
tokio.workspace = true
wiremock.workspace = true
