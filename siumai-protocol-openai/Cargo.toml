[package]
name = "siumai-protocol-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "OpenAI Chat Completions, Responses, and Realtime wire codecs for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-protocol-openai"
readme = "../README.md"
keywords = ["llm", "ai", "openai", "protocol"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true

[features]
default = []

# OpenAI Responses API mapping.
openai-responses = []

# Experimental OpenAI Realtime and Realtime Translation wire codecs.
openai-realtime = []
