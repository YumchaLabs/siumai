[package]
name = "siumai-provider-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Provider-facing utility seams for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-utils"
readme = "../README.md"
keywords = ["llm", "ai"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-spec = { workspace = true, default-features = false }

serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true
infer.workspace = true
regex.workspace = true
base64.workspace = true
rand.workspace = true

[features]
default = []

structured-messages = ["siumai-spec/structured-messages"]
