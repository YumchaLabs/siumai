[package]
name = "siumai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Ergonomic, provider-faithful AI model interfaces for Rust"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai"
readme = "../README.md"
keywords = ["llm", "ai", "openai", "anthropic", "async"]
categories = ["api-bindings"]
autoexamples = false
autotests = false

[lib]
doctest = true

[package.metadata.docs.rs]
no-default-features = true
features = [
    "runtime",
    "json-schema",
    "registry",
    "all-providers",
    "openai-compatible",
    "openai-realtime",
    "openai-responses-websocket",
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-runtime = { workspace = true, default-features = false, optional = true }
siumai-registry = { workspace = true, default-features = false, optional = true }

siumai-provider-openai = { version = "0.11.0-beta.9", path = "../siumai-provider-openai", default-features = false, optional = true }
siumai-provider-alibaba = { workspace = true, optional = true }
siumai-provider-moonshotai = { workspace = true, optional = true }
siumai-provider-volcengine = { workspace = true, optional = true }
siumai-openai-compatible = { version = "0.11.0-beta.9", path = "../siumai-openai-compatible", default-features = false, optional = true }
siumai-provider-anthropic = { version = "0.11.0-beta.9", path = "../siumai-provider-anthropic", default-features = false, optional = true }
siumai-provider-gemini = { version = "0.11.0-beta.9", path = "../siumai-provider-gemini", default-features = false, optional = true }
siumai-provider-google-vertex = { version = "0.11.0-beta.9", path = "../siumai-provider-google-vertex", default-features = false, optional = true }
siumai-provider-groq = { version = "0.11.0-beta.9", path = "../siumai-provider-groq", default-features = false, optional = true }
siumai-provider-xai = { version = "0.11.0-beta.9", path = "../siumai-provider-xai", default-features = false, optional = true }
siumai-provider-minimax = { version = "0.11.0-beta.9", path = "../siumai-provider-minimax", default-features = false, optional = true }
siumai-provider-deepseek = { version = "0.11.0-beta.9", path = "../siumai-provider-deepseek", default-features = false, optional = true }
siumai-provider-cohere = { version = "0.11.0-beta.9", path = "../siumai-provider-cohere", default-features = false, optional = true }
siumai-provider-deepgram = { version = "0.11.0-beta.9", path = "../siumai-provider-deepgram", default-features = false, optional = true }
siumai-provider-elevenlabs = { version = "0.11.0-beta.9", path = "../siumai-provider-elevenlabs", default-features = false, optional = true }

[features]
default = ["registry", "runtime"]
registry = ["dep:siumai-registry"]
runtime = ["dep:siumai-runtime"]
json-schema = ["runtime", "siumai-runtime/json-schema"]

openai = ["dep:siumai-provider-openai"]
alibaba = ["dep:siumai-provider-alibaba"]
moonshotai = ["dep:siumai-provider-moonshotai"]
volcengine = ["dep:siumai-provider-volcengine"]
openai-realtime = ["openai", "siumai-provider-openai/openai-realtime"]
openai-responses-websocket = ["openai", "siumai-provider-openai/openai-responses-websocket"]
openai-compatible = ["dep:siumai-openai-compatible"]
anthropic = ["dep:siumai-provider-anthropic"]
google = ["dep:siumai-provider-gemini"]
google-vertex-anthropic = ["dep:siumai-provider-google-vertex"]
groq = ["dep:siumai-provider-groq"]
xai = ["dep:siumai-provider-xai"]
minimax = ["dep:siumai-provider-minimax"]
deepseek = ["dep:siumai-provider-deepseek"]
cohere = ["dep:siumai-provider-cohere"]
deepgram = ["dep:siumai-provider-deepgram"]
elevenlabs = ["dep:siumai-provider-elevenlabs"]

all-providers = [
    "openai",
    "alibaba",
    "moonshotai",
    "volcengine",
    "anthropic",
    "google",
    "google-vertex-anthropic",
    "groq",
    "xai",
    "minimax",
    "deepseek",
    "cohere",
    "deepgram",
    "elevenlabs",
]

[[test]]
name = "facade_contract"
path = "tests/facade_contract.rs"

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
siumai-transport = { workspace = true, default-features = false }
siumai-protocol-openai = { workspace = true, default-features = false }
wiremock.workspace = true
