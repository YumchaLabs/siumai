[package]
name = "siumai-anthropic-compatible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Reusable configured Anthropic Messages-compatible execution engine for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-anthropic-compatible"
readme = "../README.md"
keywords = ["llm", "ai", "anthropic", "compat"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-protocol-anthropic = { version = "0.11.0-beta.10", path = "../siumai-protocol-anthropic", default-features = false }
siumai-transport = { workspace = true, default-features = false }

async-trait.workspace = true
async-stream.workspace = true
futures-util.workspace = true
http.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []

[dev-dependencies]
chrono.workspace = true
tokio.workspace = true
wiremock.workspace = true
