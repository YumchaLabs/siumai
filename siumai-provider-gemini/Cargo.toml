[package]
name = "siumai-provider-gemini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Provider-faithful Google Gemini APIs for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-gemini"
readme = "../README.md"
keywords = ["llm", "ai", "gemini", "google"]
