[package]
name = "siumai-provider-groq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust-first Groq Chat, Responses, transcription, and speech provider for Siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-groq"
readme = "../README.md"
keywords = ["llm", "ai", "groq"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-protocol-openai = { version = "0.11.0-beta.11", path = "../siumai-protocol-openai", default-features = false, features = ["openai-responses"] }
siumai-openai-compatible = { version = "0.11.0-beta.11", path = "../siumai-openai-compatible", default-features = false }
siumai-transport = { workspace = true, default-features = false }

async-trait.workspace = true
chrono.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[features]
default = []

[dev-dependencies]
bytes.workspace = true
mockito.workspace = true
tokio.workspace = true
