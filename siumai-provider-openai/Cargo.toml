[package]
name = "siumai-provider-openai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "OpenAI provider implementation for siumai"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/siumai-provider-openai"
readme = "../README.md"
keywords = ["llm", "ai", "openai"]
categories = ["api-bindings"]

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false

[dependencies]
siumai-core = { workspace = true, default-features = false }
siumai-openai-compatible = { version = "0.11.0-beta.10", path = "../siumai-openai-compatible", default-features = false }
siumai-transport = { workspace = true, default-features = false }
siumai-protocol-openai = { version = "0.11.0-beta.10", path = "../siumai-protocol-openai", default-features = false, features = ["openai-responses"] }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
tokio.workspace = true
futures-util.workspace = true
async-stream.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid = { workspace = true, optional = true }
url = { workspace = true, optional = true }
urlencoding.workspace = true
secrecy.workspace = true

[features]
default = []

# Experimental persistent OpenAI Responses WebSocket sessions.
openai-responses-websocket = ["dep:uuid"]

# Experimental native OpenAI Realtime and Realtime Translation sessions.
openai-realtime = ["dep:url", "dep:uuid", "siumai-protocol-openai/openai-realtime"]

[dev-dependencies]
wiremock.workspace = true
